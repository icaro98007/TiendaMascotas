<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXUS-IoT | Telemetría Industrial</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

  <!-- React 18, ReactDOM & Babel (con CDNs de alta disponibilidad) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #030712;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #030712; }
    ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #374151; }
  </style>
</head>
<body class="h-full bg-gray-950 text-gray-100 antialiased selection:bg-emerald-500 selection:text-white">
  <div id="root" class="h-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Colección de Iconos SVG Vectoriales (100% compatibles con Lucide)
    const Icons = {
      Activity: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
      ),
      Cpu: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M15 2v2"/><path d="M15 20v2"/><path d="M2 15h2"/><path d="M2 9h2"/><path d="M20 15h2"/><path d="M20 9h2"/><path d="M9 2v2"/><path d="M9 20v2"/>
        </svg>
      ),
      Wifi: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M12 20h.01"/><path d="M2 8.82a15 15 0 0 1 20 0"/><path d="M5 12.859a10 10 0 0 1 14 0"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/>
        </svg>
      ),
      WifiOff: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.58 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/>
        </svg>
      ),
      Thermometer: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/>
        </svg>
      ),
      Zap: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
      ),
      Radio: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="12" cy="12" r="2"/><path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14"/>
        </svg>
      ),
      AlertTriangle: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
      ),
      CheckCircle2: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="m9 12 2 2 4-4"/>
        </svg>
      ),
      Clock: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
        </svg>
      ),
      Search: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      ),
      Bell: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
        </svg>
      ),
      Filter: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
        </svg>
      ),
      RefreshCw: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>
        </svg>
      ),
      Layers: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/>
        </svg>
      ),
      Settings: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      ),
      BatteryCharging: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M15 7h1a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-2"/><path d="M6 7H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h1"/><line x1="22" y1="11" x2="22" y2="13"/><polyline points="11 6 7 12 13 12 9 18"/>
        </svg>
      ),
      TrendingUp: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>
        </svg>
      ),
      ShieldCheck: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>
        </svg>
      ),
      MoreVertical: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/>
        </svg>
      ),
      Play: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
      ),
      Pause: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="currentColor">
          <rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>
        </svg>
      ),
      ArrowUpRight: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/>
        </svg>
      ),
      ChevronRight: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      )
    };

    function IoTApp() {
      const [activeTab, setActiveTab] = useState('telemetry');
      const [filterStatus, setFilterStatus] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const [isLiveStreaming, setIsLiveStreaming] = useState(true);
      const [timeRange, setTimeRange] = useState('15m');
      const [powerWatts, setPowerWatts] = useState(148.6);
      const [toastMessage, setToastMessage] = useState(null);

      // Simulación de fluctuación de telemetría en tiempo real
      useEffect(() => {
        if (!isLiveStreaming) return;
        const interval = setInterval(() => {
          setPowerWatts(prev => +(prev + (Math.random() * 0.8 - 0.4)).toFixed(1));
        }, 2000);
        return () => clearInterval(interval);
      }, [isLiveStreaming]);

      const showNotification = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3000);
      };

      const nodes = [
        {
          id: 'NODE-TX-104',
          name: 'Turbina de Presión #04',
          location: 'Nave Industrial Norte',
          status: 'active',
          temp: '68.4 °C',
          vibration: '2.1 mm/s',
          signal: 94,
          battery: '98%'
        },
        {
          id: 'NODE-TX-108',
          name: 'Compresor Criogénico C2',
          location: 'Módulo de Gasoducto B',
          status: 'warning',
          temp: '82.7 °C',
          vibration: '4.8 mm/s',
          signal: 78,
          battery: '41%'
        },
        {
          id: 'NODE-TX-115',
          name: 'Bomba Hidráulica P-01',
          location: 'Planta de Tratamiento',
          status: 'active',
          temp: '54.2 °C',
          vibration: '1.4 mm/s',
          signal: 89,
          battery: '85%'
        },
        {
          id: 'NODE-TX-122',
          name: 'Transformador Eléctrico T-3',
          location: 'Subestación Principal',
          status: 'active',
          temp: '61.0 °C',
          vibration: '0.8 mm/s',
          signal: 97,
          battery: 'AC Line'
        },
        {
          id: 'NODE-TX-139',
          name: 'Extrusora Térmica E-9',
          location: 'Línea de Ensamblaje 3',
          status: 'offline',
          temp: '-- °C',
          vibration: '--',
          signal: 0,
          battery: '12%'
        }
      ];

      const filteredNodes = nodes.filter(node => {
        const matchesFilter = filterStatus === 'all' ? true : node.status === filterStatus;
        const matchesSearch =
          node.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
          node.id.toLowerCase().includes(searchQuery.toLowerCase()) ||
          node.location.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesFilter && matchesSearch;
      });

      return (
        <div className="flex h-screen w-full bg-gray-950 text-gray-100 overflow-hidden font-sans">
          
          {/* TOAST FLOTANTE */}
          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 flex items-center gap-3 bg-gray-900 border border-emerald-500/50 text-white px-4 py-3 rounded-xl shadow-2xl shadow-emerald-500/20 animate-bounce">
              <Icons.CheckCircle2 className="w-5 h-5 text-emerald-400" />
              <span className="text-sm font-medium">{toastMessage}</span>
            </div>
          )}

          {/* SIDEBAR LATERAL */}
          <aside className="w-64 flex-shrink-0 bg-gray-900 border-r border-gray-800 flex flex-col justify-between p-6">
            <div className="space-y-6">
              
              {/* Logo / Header */}
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 shadow-lg shadow-emerald-500/10">
                  <Icons.Radio className="w-5 h-5 animate-pulse" />
                </div>
                <div>
                  <h1 className="text-white font-bold text-base tracking-wide flex items-center gap-2">
                    NEXUS-IoT
                    <span className="text-[10px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-1.5 py-0.5 rounded font-mono font-medium">
                      v2.4
                    </span>
                  </h1>
                  <p className="text-xs text-gray-400">Plataforma Edge Telemetry</p>
                </div>
              </div>

              {/* Menú de Navegación */}
              <nav className="space-y-1">
                <p className="text-[11px] font-semibold text-gray-400 uppercase tracking-wider px-3 mb-2">
                  Monitoreo
                </p>
                {[
                  { id: 'telemetry', label: 'Telemetría en Vivo', icon: Icons.Activity },
                  { id: 'nodes', label: 'Nodos y Sensores', icon: Icons.Cpu, badge: '25' },
                  { id: 'network', label: 'Topología Mesh', icon: Icons.Wifi },
                  { id: 'analytics', label: 'Diagnóstico & Logs', icon: Icons.Layers }
                ].map(item => {
                  const Icon = item.icon;
                  const isActive = activeTab === item.id;
                  return (
                    <button
                      key={item.id}
                      onClick={() => setActiveTab(item.id)}
                      className={`w-full flex items-center justify-between px-3.5 py-2.5 rounded-lg text-sm font-medium transition-all ${
                        isActive
                          ? 'bg-emerald-500 text-white shadow-lg shadow-emerald-500/20'
                          : 'text-gray-400 hover:text-white hover:bg-gray-800'
                      }`}
                    >
                      <div className="flex items-center gap-3">
                        <Icon className="w-4 h-4" />
                        <span>{item.label}</span>
                      </div>
                      {item.badge && (
                        <span className={`text-xs px-2 py-0.5 rounded-full font-mono ${isActive ? 'bg-emerald-600 text-white' : 'bg-gray-800 text-gray-300'}`}>
                          {item.badge}
                        </span>
                      )}
                    </button>
                  );
                })}

                <div className="pt-4">
                  <p className="text-[11px] font-semibold text-gray-400 uppercase tracking-wider px-3 mb-2">
                    Mantenimiento
                  </p>
                  {[
                    { id: 'alerts', label: 'Alertas Activas', icon: Icons.AlertTriangle, badge: '2' },
                    { id: 'settings', label: 'Configuración Edge', icon: Icons.Settings }
                  ].map(item => {
                    const Icon = item.icon;
                    const isActive = activeTab === item.id;
                    return (
                      <button
                        key={item.id}
                        onClick={() => setActiveTab(item.id)}
                        className={`w-full flex items-center justify-between px-3.5 py-2.5 rounded-lg text-sm font-medium transition-all ${
                          isActive
                            ? 'bg-emerald-500 text-white shadow-lg shadow-emerald-500/20'
                            : 'text-gray-400 hover:text-white hover:bg-gray-800'
                        }`}
                      >
                        <div className="flex items-center gap-3">
                          <Icon className="w-4 h-4" />
                          <span>{item.label}</span>
                        </div>
                        {item.badge && (
                          <span className="text-xs px-2 py-0.5 rounded-full font-mono bg-amber-500/20 text-amber-300 border border-amber-500/30">
                            {item.badge}
                          </span>
                        )}
                      </button>
                    );
                  })}
                </div>
              </nav>
            </div>

            {/* Edge Gateway Status */}
            <div className="bg-gray-950 p-4 rounded-xl border border-gray-800 space-y-3">
              <div className="flex items-center justify-between">
                <span className="text-xs font-medium text-gray-400 flex items-center gap-2">
                  <span className="w-2 h-2 rounded-full bg-emerald-500 animate-ping" />
                  Gateway Mesh #01
                </span>
                <span className="text-[11px] font-mono text-emerald-400">Online</span>
              </div>
              <div className="space-y-1">
                <div className="flex justify-between text-xs text-gray-400">
                  <span>Carga CPU Edge</span>
                  <span className="text-white font-mono">18%</span>
                </div>
                <div className="w-full bg-gray-800 h-1.5 rounded-full overflow-hidden">
                  <div className="bg-emerald-500 h-full rounded-full w-[18%]" />
                </div>
              </div>
              <p className="text-[11px] text-gray-400">Broker: <span className="text-gray-300 font-mono">localhost:1883</span></p>
            </div>
          </aside>

          {/* CONTENIDO PRINCIPAL */}
          <main className="flex-1 flex flex-col min-w-0 overflow-y-auto">
            
            {/* Topbar */}
            <header className="h-16 px-6 bg-gray-900 border-b border-gray-800 flex items-center justify-between flex-shrink-0">
              <div className="flex items-center gap-4">
                <h2 className="text-white text-lg font-semibold tracking-tight">
                  Centro de Control de Telemetría
                </h2>
                <div className="flex items-center gap-2 px-2.5 py-1 rounded-md bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-mono">
                  <span className={`w-1.5 h-1.5 rounded-full ${isLiveStreaming ? 'bg-emerald-500 animate-pulse' : 'bg-gray-500'}`} />
                  {isLiveStreaming ? 'LIVE STREAMING' : 'PAUSADO'}
                </div>
              </div>

              <div className="flex items-center gap-4">
                {/* Buscador */}
                <div className="relative">
                  <Icons.Search className="w-4 h-4 text-gray-400 absolute left-3 top-1/2 -translate-y-1/2" />
                  <input
                    type="text"
                    placeholder="Filtrar por nodo, ID o zona..."
                    value={searchQuery}
                    onChange={e => setSearchQuery(e.target.value)}
                    className="w-64 bg-gray-950 border border-gray-800 rounded-lg pl-9 pr-4 py-1.5 text-sm text-gray-200 placeholder-gray-500 focus:outline-none focus:border-emerald-500 transition-all"
                  />
                </div>

                {/* Control de Stream */}
                <button
                  onClick={() => {
                    setIsLiveStreaming(!isLiveStreaming);
                    showNotification(isLiveStreaming ? 'Stream de telemetría pausado' : 'Stream en tiempo real reanudado');
                  }}
                  className={`flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-medium border transition-all ${
                    isLiveStreaming
                      ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30 hover:bg-emerald-500/20'
                      : 'bg-gray-800 text-gray-400 border-gray-700 hover:text-white'
                  }`}
                >
                  {isLiveStreaming ? <Icons.Pause className="w-3.5 h-3.5" /> : <Icons.Play className="w-3.5 h-3.5" />}
                  {isLiveStreaming ? 'Pausar Telemetría' : 'Reanudar'}
                </button>

                {/* Botón Refresco */}
                <button
                  onClick={() => showNotification('Telemetría sincronizada con Edge Gateway')}
                  className="p-2 text-gray-400 hover:text-white hover:bg-gray-800 rounded-lg border border-gray-800 transition-all"
                >
                  <Icons.RefreshCw className="w-4 h-4" />
                </button>

                {/* Campana */}
                <button className="p-2 text-gray-400 hover:text-white hover:bg-gray-800 rounded-lg border border-gray-800 relative transition-all">
                  <Icons.Bell className="w-4 h-4" />
                  <span className="w-2 h-2 rounded-full bg-emerald-500 absolute top-1.5 right-1.5" />
                </button>
              </div>
            </header>

            {/* Canvas de Datos con p-6 y gap-6 */}
            <div className="p-6 space-y-6">
              
              {/* FILA 1: TARJETAS KPIS */}
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                
                {/* KPI 1 */}
                <div className="bg-gray-900 border border-gray-800 rounded-xl p-6 hover:border-gray-700 transition-all">
                  <div className="flex items-center justify-between">
                    <span className="text-sm font-medium text-gray-400">Nodos Conectados</span>
                    <div className="w-9 h-9 rounded-lg bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400">
                      <Icons.Cpu className="w-5 h-5" />
                    </div>
                  </div>
                  <div className="mt-4 flex items-baseline gap-2">
                    <span className="text-2xl font-bold text-white font-mono">23</span>
                    <span className="text-xs text-gray-400">/ 25 en línea</span>
                  </div>
                  <div className="mt-3 flex items-center text-xs text-emerald-400 gap-1 font-medium">
                    <Icons.TrendingUp className="w-3.5 h-3.5" />
                    <span>92.0%</span>
                    <span className="text-gray-400 font-normal">disponibilidad mesh</span>
                  </div>
                </div>

                {/* KPI 2 */}
                <div className="bg-gray-900 border border-gray-800 rounded-xl p-6 hover:border-gray-700 transition-all">
                  <div className="flex items-center justify-between">
                    <span className="text-sm font-medium text-gray-400">Temperatura de Planta</span>
                    <div className="w-9 h-9 rounded-lg bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400">
                      <Icons.Thermometer className="w-5 h-5" />
                    </div>
                  </div>
                  <div className="mt-4 flex items-baseline gap-2">
                    <span className="text-2xl font-bold text-white font-mono">63.8 °C</span>
                    <span className="text-xs text-emerald-400 font-medium">Estable</span>
                  </div>
                  <div className="mt-3 flex items-center text-xs text-gray-400 gap-1">
                    <span>Umbral crítico: 85.0 °C</span>
                  </div>
                </div>

                {/* KPI 3 */}
                <div className="bg-gray-900 border border-gray-800 rounded-xl p-6 hover:border-gray-700 transition-all">
                  <div className="flex items-center justify-between">
                    <span className="text-sm font-medium text-gray-400">Potencia de Red</span>
                    <div className="w-9 h-9 rounded-lg bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400">
                      <Icons.Zap className="w-5 h-5" />
                    </div>
                  </div>
                  <div className="mt-4 flex items-baseline gap-2">
                    <span className="text-2xl font-bold text-white font-mono">{powerWatts} kW</span>
                    <span className="text-xs text-gray-400 font-mono">cos φ 0.97</span>
                  </div>
                  <div className="mt-3 flex items-center text-xs text-emerald-400 gap-1 font-medium">
                    <Icons.ArrowUpRight className="w-3.5 h-3.5" />
                    <span>Eficiencia 96.4%</span>
                  </div>
                </div>

                {/* KPI 4 */}
                <div className="bg-gray-900 border border-gray-800 rounded-xl p-6 hover:border-gray-700 transition-all">
                  <div className="flex items-center justify-between">
                    <span className="text-sm font-medium text-gray-400">Latencia Edge Mesh</span>
                    <div className="w-9 h-9 rounded-lg bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400">
                      <Icons.Clock className="w-5 h-5" />
                    </div>
                  </div>
                  <div className="mt-4 flex items-baseline gap-2">
                    <span className="text-2xl font-bold text-white font-mono">14 ms</span>
                    <span className="text-xs text-emerald-400 font-medium">&plusmn; 1.2ms</span>

                  <div className="mt-3 flex items-center text-xs text-gray-400 gap-1">
                    <span>0 paquetes perdidos</span>
                  </div>
                </div>

              </div>

              {/* FILA 2: GRÁFICO DE TELEMETRÍA Y DISTRIBUCIÓN */}
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                
                {/* Gráfico SVG */}
                <div className="lg:col-span-2 bg-gray-900 border border-gray-800 rounded-xl p-6 space-y-6">
                  <div className="flex items-center justify-between">
                    <div>
                      <h3 className="text-white text-base font-semibold">
                        Espectro de Vibración & Carga en Tiempo Real
                      </h3>
                      <p className="text-sm text-gray-400">
                        Señales muestreadas a 50Hz desde actuadores y bombas
                      </p>
                    </div>
                    <div className="flex items-center gap-2">
                      <span className="text-xs text-gray-400">Rango:</span>
                      <div className="flex bg-gray-950 p-1 rounded-lg border border-gray-800 text-xs">
                        {['15m', '1h', '24h'].map(rng => (
                          <button
                            key={rng}
                            onClick={() => setTimeRange(rng)}
                            className={`px-2.5 py-1 rounded transition-all ${timeRange === rng ? 'bg-emerald-500 text-white font-medium' : 'text-gray-400 hover:text-white'}`}
                          >
                            {rng}
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>

                  {/* SVG Graficador */}
                  <div className="h-56 w-full relative flex flex-col justify-end">
                    <div className="absolute inset-0 flex flex-col justify-between pointer-events-none opacity-20">
                      <div className="border-b border-gray-700 w-full" />
                      <div className="border-b border-gray-700 w-full" />
                      <div className="border-b border-gray-700 w-full" />
                      <div className="border-b border-gray-700 w-full" />
                    </div>

                    <svg className="w-full h-44 overflow-visible" viewBox="0 0 500 120" preserveAspectRatio="none">
                      <defs>
                        <linearGradient id="emeraldGrad" x1="0" y1="0" x2="0" y2="1">
                          <stop offset="0%" stopColor="#10b981" stopOpacity="0.4" />
                          <stop offset="100%" stopColor="#10b981" stopOpacity="0.0" />
                        </linearGradient>
                      </defs>

                      <path
                        d="M 0,85 Q 60,35 120,60 T 240,40 T 360,70 T 450,25 T 500,50 L 500,120 L 0,120 Z"
                        fill="url(#emeraldGrad)"
                      />
                      <path
                        d="M 0,85 Q 60,35 120,60 T 240,40 T 360,70 T 450,25 T 500,50"
                        fill="none"
                        stroke="#10b981"
                        strokeWidth="2.5"
                        strokeLinecap="round"
                      />
                      <circle cx="450" cy="25" r="4" fill="#10b981" />
                      <circle cx="500" cy="50" r="4" fill="#34d399" className="animate-ping" />
                    </svg>

                    <div className="flex justify-between text-[11px] font-mono text-gray-400 pt-3 border-t border-gray-800">
                      <span>14:15:00</span>
                      <span>14:20:00</span>
                      <span>14:25:00</span>
                      <span>14:30:00</span>
                      <span className="text-emerald-400 font-semibold">Ahora</span>
                    </div>
                  </div>

                  <div className="flex items-center justify-between pt-2 border-t border-gray-800/80 text-xs">
                    <div className="flex items-center gap-6">
                      <div className="flex items-center gap-2">
                        <span className="w-3 h-3 rounded-full bg-emerald-500" />
                        <span className="text-gray-300">Vibración Mecánica (2.1 mm/s)</span>
                      </div>
                      <div className="flex items-center gap-2">
                        <span className="w-3 h-3 rounded-full bg-cyan-500/60" />
                        <span className="text-gray-400">Temperatura Externa</span>
                      </div>
                    </div>
                    <span className="text-gray-400 font-mono">Algoritmo FFT: Activo</span>
                  </div>
                </div>

                {/* Estado de la Flota */}
                <div className="bg-gray-900 border border-gray-800 rounded-xl p-6 flex flex-col justify-between space-y-6">
                  <div>
                    <h3 className="text-white text-base font-semibold">
                      Salud de Sensores
                    </h3>
                    <p className="text-sm text-gray-400">
                      Estado operativo en campo
                    </p>
                  </div>

                  <div className="space-y-4">
                    <div className="space-y-1.5">
                      <div className="flex justify-between text-xs">
                        <span className="text-gray-300 flex items-center gap-1.5">
                          <span className="w-2 h-2 rounded-full bg-emerald-500" />
                          Operativo Óptimo
                        </span>
                        <span className="text-white font-mono font-medium">92%</span>
                      </div>
                      <div className="w-full bg-gray-950 h-2 rounded-full overflow-hidden border border-gray-800">
                        <div className="bg-emerald-500 h-full rounded-full w-[92%]" />
                      </div>
                    </div>

                    <div className="space-y-1.5">
                      <div className="flex justify-between text-xs">
                        <span className="text-gray-300 flex items-center gap-1.5">
                          <span className="w-2 h-2 rounded-full bg-amber-500" />
                          En Advertencia
                        </span>
                        <span className="text-white font-mono font-medium">4%</span>
                      </div>
                      <div className="w-full bg-gray-950 h-2 rounded-full overflow-hidden border border-gray-800">
                        <div className="bg-amber-500 h-full rounded-full w-[4%]" />
                      </div>
                    </div>

                    <div className="space-y-1.5">
                      <div className="flex justify-between text-xs">
                        <span className="text-gray-300 flex items-center gap-1.5">
                          <span className="w-2 h-2 rounded-full bg-rose-500" />
                          Fuera de Línea
                        </span>
                        <span className="text-white font-mono font-medium">4%</span>
                      </div>
                      <div className="w-full bg-gray-950 h-2 rounded-full overflow-hidden border border-gray-800">
                        <div className="bg-rose-500 h-full rounded-full w-[4%]" />
                      </div>
                    </div>
                  </div>

                  <button
                    onClick={() => showNotification('Auto-diagnóstico completado: Red Mesh sin errores')}
                    className="w-full flex items-center justify-center gap-2 bg-emerald-500 hover:bg-emerald-600 text-white text-sm font-semibold py-2.5 px-4 rounded-lg shadow-lg shadow-emerald-500/20 transition-all cursor-pointer"
                  >
                    <Icons.ShieldCheck className="w-4 h-4" />
                    Ejecutar Diagnóstico Mesh
                  </button>
                </div>

              </div>

              {/* FILA 3: TABLA DE SENSORES Y EVENTOS */}
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                
                {/* Tabla */}
                <div className="lg:col-span-2 bg-gray-900 border border-gray-800 rounded-xl p-6 space-y-4">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div>
                      <h3 className="text-white text-base font-semibold">
                        Nodos de Telemetría Registrados
                      </h3>
                      <p className="text-sm text-gray-400">
                        Transmisión activa vía protocolo MQTT/CoAP
                      </p>
                    </div>

                    <div className="flex items-center gap-2">
                      <Icons.Filter className="w-4 h-4 text-gray-400" />
                      <div className="flex bg-gray-950 p-1 rounded-lg border border-gray-800 text-xs">
                        {['all', 'active', 'warning', 'offline'].map(status => (
                          <button
                            key={status}
                            onClick={() => setFilterStatus(status)}
                            className={`px-3 py-1 rounded capitalize font-medium transition-all ${
                              filterStatus === status
                                ? 'bg-emerald-500 text-white shadow-sm'
                                : 'text-gray-400 hover:text-white'
                            }`}
                          >
                            {status === 'all'
                              ? 'Todos'
                              : status === 'active'
                              ? 'Activos'
                              : status === 'warning'
                              ? 'Alerta'
                              : 'Offline'}
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-sm">
                      <thead>
                        <tr className="border-b border-gray-800 text-xs font-semibold text-gray-400 uppercase tracking-wider">
                          <th className="pb-3 pr-4">Identificador</th>
                          <th className="pb-3 px-4">Ubicación</th>
                          <th className="pb-3 px-4">Temp</th>
                          <th className="pb-3 px-4">Señal</th>
                          <th className="pb-3 px-4">Batería</th>
                          <th className="pb-3 px-4">Estado</th>
                          <th className="pb-3 pl-4 text-right">Acción</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-gray-800/60">
                        {filteredNodes.map(node => (
                          <tr
                            key={node.id}
                            className="hover:bg-gray-800/50 transition-all group"
                          >
                            <td className="py-3.5 pr-4">
                              <div className="font-medium text-white group-hover:text-emerald-400 transition-colors">
                                {node.name}
                              </div>
                              <div className="text-xs text-gray-400 font-mono">
                                {node.id}
                              </div>
                            </td>

                            <td className="py-3.5 px-4 text-gray-300 text-xs">
                              {node.location}
                            </td>

                            <td className="py-3.5 px-4 font-mono text-xs text-white">
                              {node.temp}
                            </td>

                            <td className="py-3.5 px-4">
                              <div className="flex items-center gap-1.5">
                                {node.signal > 0 ? (
                                  <>
                                    <Icons.Wifi className="w-3.5 h-3.5 text-emerald-400" />
                                    <span className="text-xs font-mono text-gray-300">
                                      {node.signal}%
                                    </span>
                                  </>
                                ) : (
                                  <>
                                    <Icons.WifiOff className="w-3.5 h-3.5 text-rose-400" />
                                    <span className="text-xs font-mono text-rose-400">
                                      0%
                                    </span>
                                  </>
                                )}
                              </div>
                            </td>

                            <td className="py-3.5 px-4 text-xs font-mono text-gray-300">
                              <div className="flex items-center gap-1">
                                <Icons.BatteryCharging className="w-3.5 h-3.5 text-gray-400" />
                                {node.battery}
                              </div>
                            </td>

                            <td className="py-3.5 px-4">
                              {node.status === 'active' && (
                                <span className="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">
                                  <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse" />
                                  Operativo
                                </span>
                              )}
                              {node.status === 'warning' && (
                                <span className="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-medium bg-amber-500/10 text-amber-300 border border-amber-500/30">
                                  <Icons.AlertTriangle className="w-3 h-3" />
                                  Alerta
                                </span>
                              )}
                              {node.status === 'offline' && (
                                <span className="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-medium bg-rose-500/10 text-rose-400 border border-rose-500/30">
                                  Desconectado
                                </span>
                              )}
                            </td>

                            <td className="py-3.5 pl-4 text-right">
                              <button
                                onClick={() => showNotification(`Comando enviado a ${node.id}`)}
                                className="p-1.5 text-gray-400 hover:text-white hover:bg-gray-800 rounded-md transition-all cursor-pointer"
                              >
                                <Icons.MoreVertical className="w-4 h-4" />
                              </button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

                {/* Alertas */}
                <div className="bg-gray-900 border border-gray-800 rounded-xl p-6 space-y-4 flex flex-col justify-between">
                  <div>
                    <div className="flex items-center justify-between mb-1">
                      <h3 className="text-white text-base font-semibold">
                        Alertas Recientes
                      </h3>
                      <span className="text-xs bg-gray-800 text-gray-300 px-2 py-0.5 rounded-full font-mono">
                        En vivo
                      </span>
                    </div>
                    <p className="text-sm text-gray-400">
                      Anomalías de sensor en tiempo real
                    </p>

                    <div className="mt-4 space-y-3">
                      <div className="p-3.5 bg-gray-950 rounded-lg border border-gray-800 hover:border-gray-700 transition-all space-y-1.5">
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-semibold text-amber-400 flex items-center gap-1.5">
                            <Icons.AlertTriangle className="w-3.5 h-3.5" />
                            Umbral térmico superado
                          </span>
                          <span className="text-[11px] font-mono text-gray-500">14:28:10</span>
                        </div>
                        <p className="text-xs text-gray-400 leading-relaxed">
                          Temperatura en 82.7 °C superó el rango óptimo (&lt; 75 °C).
                        </p>
                        <div className="text-[11px] font-mono text-gray-500 pt-1">
                          Nodo: <span className="text-gray-300">NODE-TX-108 (Compresor C2)</span>
                        </div>
                      </div>

                      <div className="p-3.5 bg-gray-950 rounded-lg border border-gray-800 hover:border-gray-700 transition-all space-y-1.5">
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-semibold text-rose-400 flex items-center gap-1.5">
                            <Icons.AlertTriangle className="w-3.5 h-3.5" />
                            Pérdida de señal de nodo
                          </span>
                          <span className="text-[11px] font-mono text-gray-500">14:10:45</span>
                        </div>
                        <p className="text-xs text-gray-400 leading-relaxed">
                          Nodo no responde a paquetes ping desde hace 18 minutos.
                        </p>
                        <div className="text-[11px] font-mono text-gray-500 pt-1">
                          Nodo: <span className="text-gray-300">NODE-TX-139 (Extrusora E-9)</span>
                        </div>
                      </div>
                    </div>
                  </div>

                  <button
                    onClick={() => showNotification('Cargando historial de telemetría completa...')}
                    className="w-full flex items-center justify-center gap-1.5 text-xs text-gray-400 hover:text-white py-2 bg-gray-800/40 hover:bg-gray-800 rounded-lg border border-gray-800 transition-all font-medium cursor-pointer"
                  >
                    Ver registro de auditoría
                    <Icons.ChevronRight className="w-3.5 h-3.5" />
                  </button>
                </div>

              </div>

            </div>
          </main>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<IoTApp />);
  </script>
</body>
